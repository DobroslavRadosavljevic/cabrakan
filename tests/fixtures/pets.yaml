openapi: 3.1.0
info:
  title: Pets
  version: 1.2.0
servers:
  - url: https://pets.example
paths:
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPet
      summary: Get a pet
      parameters:
        - name: verbose
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: ok
    post:
      operationId: update-pet!
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        "200":
          description: ok
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: ok
